<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ali Khan Store</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        header {
            background: #0088cc;
            color: white;
            padding: 18px;
            text-align: center;
        }

        header h1 {
            font-size: 24px;
        }

        header p {
            margin-top: 6px;
            opacity: 0.9;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }

        .search {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .products {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .product {
            background: white;
            border-radius: 15px;
            padding: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .product img {
            width: 100%;
            height: 150px;
            object-fit: contain;
            border-radius: 10px;
        }

        .product h3 {
            margin-top: 10px;
            font-size: 17px;
        }

        .price {
            color: #0088cc;
            font-weight: bold;
            margin: 8px 0;
        }

        button {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 10px;
            background: #0088cc;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

<header>
    <h1>📱 Ali Khan Store</h1>
    <p>Telefonlar va aksessuarlar</p>
</header>

<div class="container">

    <input
        class="search"
        type="text"
        placeholder="🔎 Telefon qidirish..."
    >

    <div class="products">

        <div class="product">
            <img src="https://via.placeholder.com/300x200?text=iPhone" alt="iPhone">
            <h3>iPhone 15 Pro</h3>
            <div class="price">1 200 €</div>
            <button onclick="buy('iPhone 15 Pro')">
                🛒 Sotib olish
            </button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/300x200?text=Samsung" alt="Samsung">
            <h3>Samsung S24 Ultra</h3>
            <div class="price">1 100 €</div>
            <button onclick="buy('Samsung S24 Ultra')">
                🛒 Sotib olish
            </button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/300x200?text=Redmi" alt="Redmi">
            <h3>Redmi Note 13</h3>
            <div class="price">250 €</div>
            <button onclick="buy('Redmi Note 13')">
                🛒 Sotib olish
            </button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/300x200?text=AirPods" alt="AirPods">
            <h3>AirPods Pro</h3>
            <div class="price">220 €</div>
            <button onclick="buy('AirPods Pro')">
                🛒 Sotib olish
            </button>
        </div>

    </div>
</div>

<script>
    function buy(product) {
        alert(product + " tanlandi!");
    }
</script>

</body>
</html>
